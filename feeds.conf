# Feed snapshot pinned to the same day as the base tag (2026-09-30).
# The base tree ships an unpinned feeds.conf.default pointing at
# git.openwrt.org. That is both slow from GitHub-hosted runners and
# non-reproducible. We use the official GitHub mirrors and pin each feed to
# the last commit on master before 2026-10-01, i.e. the feed state the base
# tag was built and tested against.
# `scripts/feeds` understands the `^<commit>` suffix.
