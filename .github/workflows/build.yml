name: build-be9300

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release with the images"
        type: boolean
        default: false
      verbose:
        description: "Verbose build (make V=s, very large log)"
        type: boolean
        default: false
      jobs:
        description: "Parallel make jobs"
        type: choice
        options: ["2", "4", "6", "8"]
        default: "4"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-be9300-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  WORK: ${{ github.workspace }}/work
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euxo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/.ghcup
          sudo apt-get clean
          df -h /
          # A full OpenWrt build needs roughly 25 GB; the stock runner has
          # ~14 GB free until the SDKs above are removed.
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          if [ "$avail_kb" -lt 22000000 ]; then
            echo "::error::only $((avail_kb/1024/1024)) GiB free after cleanup; need >= 22 GiB"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync unzip zlib1g-dev file wget curl ccache \
            libelf-dev bc libtool automake autoconf pkg-config time xsltproc \
            cpio swig

      - name: Prepare cache directories
        run: mkdir -p "$WORK/openwrt/dl" "$CCACHE_DIR"

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/work/openwrt/dl
          key: dl-${{ hashFiles('feeds.conf', 'configs/be9300-oaf.config', 'versions.env') }}
          restore-keys: |
            dl-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build
        env:
          JOBS: ${{ inputs.jobs || '4' }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh --jobs "$JOBS" ${{ inputs.verbose && '--verbose' || '' }}

      - name: Show failure context
        if: failure()
        run: |
          echo "=== build.log (tail) ==="
          tail -n 200 "$WORK/openwrt/build.log" 2>/dev/null || true
          echo "=== package logs ==="
          find "$WORK/openwrt/logs" -maxdepth 2 -type f 2>/dev/null | tail -n 60 || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/openwrt/build.log
            work/openwrt/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: be9300-oaf-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/**/*.bin
            out/**/*.itb
            out/**/*.manifest
            out/**/*.buildinfo
            out/**/profiles.json
            out/**/sha256sums
            out/**/build.log
          if-no-files-found: error
          retention-days: 30

      - name: Release
        if: success() && (inputs.release || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('be9300-{0}-{1}', github.run_number, github.run_attempt) }}
          name: FanchmWrt BE9300 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            FanchmWrt-style OpenWrt mainline (25.12 line) + OpenAppFilter image for the
            GL.iNet Flint 3 (GL-BE9300, IPQ5332).

            - base: perceival/openwrt-flint3 `ref-20260930` (kernel 6.18)
            - OAF: destan19/OpenAppFilter 7.0.2
            - flow offloading is disabled on first boot so DPI sees all packets

            **Read the flashing notes before installing.** From stock use the
            `*factory*.bin` with `sysupgrade -F -n`; back up the eMMC/ART first.
          files: |
            out/**/*.bin
            out/**/*.itb
            out/**/sha256sums
